name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  LLAMA_CPP_REF: ca123ba76311290ec6ab041dd2058fed8d9f03d2

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check shell syntax
        run: bash -n install.sh packaging/linux/build.sh packaging/linux/run-worker.sh packaging/tailscale/setup-tailscale.sh packaging/uno-q/setup.sh packaging/uno-q/setup-wifi.sh
      - name: Compile
        run: python -m compileall -q lfhai
      - name: Lint
        run: python -m ruff check lfhai/ tests/
      - name: Test
        run: python -m pytest tests -q

  linux-package:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: bash packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/*

  android-dev:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Clone pinned llama.cpp
        run: |
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin "$LLAMA_CPP_REF"
          git -C llama.cpp checkout FETCH_HEAD
      - name: Assemble debug APK
        working-directory: apps/android
        run: gradle assembleDebug -PlfhaiLlamaSourceDir="$GITHUB_WORKSPACE/llama.cpp" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk

  ios-dev:
    runs-on: macos-14
    needs: core
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned llama.cpp
        run: |
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin "$LLAMA_CPP_REF"
          git -C llama.cpp checkout FETCH_HEAD
      - name: Build Swift package
        working-directory: apps/ios
        run: swift build -c release
      - name: Build native RPC library
        run: |
          cmake -S apps/ios/native -B apps/ios/native/build -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_LLAMA_CPP="$GITHUB_WORKSPACE/llama.cpp"
          cmake --build apps/ios/native/build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: ios-dev-artifacts
          path: |
            apps/ios/.build/release/*.swiftmodule
            apps/ios/native/build/liblfhai_rpc_ios.a
