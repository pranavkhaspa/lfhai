[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lfhai"
version = "0.1.4"
description = "Local-First Heterogeneous AI Runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "click>=8.1.0",
    "pydantic>=2.10.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
lfh = "lfhai.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
